[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "labsim"
version = "0.1.0"
description = "Simulated lab instruments for PyLabRobot: deterministic virtual time, a chemistry model, and timing."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  # Pinned: the PyLabRobot API is changing quickly between 0.2.x and 1.0.
  "pylabrobot==1.0.0b1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:labsim.*"]
